name: vibelink
description: VibeLink — Masofaviy Real-Vaqtli Vibratsiya Boshqaruv Tizimi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  provider: ^6.1.2
  web_socket_channel: ^3.0.1
  mqtt_client: 10.2.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  vibration: ^2.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  uuid: ^4.5.1
  crypto: ^3.0.5
  intl: ^0.19.0
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
