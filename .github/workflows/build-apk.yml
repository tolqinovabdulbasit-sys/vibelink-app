name: 🚀 Build VibeLink APK

on:
  push:
    branches: [ main, st01 ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build rejimi (release, debug, both)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

jobs:
  build:
    name: 📱 Flutter APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4

      - name: ☕ Java 17 o'rnatish
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Flutter 3.22.3 o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: 📦 Dependencylarni yuklash
        run: flutter pub get

      - name: 🔍 Kod tekshiruvi
        run: flutter analyze --no-fatal-infos || true

      - name: 🔨 Release APK yaratish
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          flutter build apk --release \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             "artifacts/VibeLink-Release-v1.0.${{ github.run_number }}.apk"

      - name: 🔨 Debug APK yaratish (zaxira)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: |
          flutter build apk --debug \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk \
             "artifacts/VibeLink-Debug-v1.0.${{ github.run_number }}.apk"

      - name: 📋 APK larni saqlash va ko'rsatish
        run: |
          echo "✅ Tayyor APK fayllar:"
          ls -lh artifacts/

      - name: 📤 APK ni Artifacts ga yuklash
        uses: actions/upload-artifact@v4
        with:
          name: "VibeLink-APK-build-${{ github.run_number }}"
          path: "artifacts/*.apk"
          retention-days: 90

      - name: 📊 Build xulosasi
        run: |
          echo "## ✅ VibeLink APK muvaffaqiyatli qurildi!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Build turi | Release (Optimizatsiya qilingan) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔢 Build | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Sana | $(date '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Yuklab olish:" >> $GITHUB_STEP_SUMMARY
          echo "**Actions** → **Bu run** → **Artifacts** → **VibeLink-APK-build-${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
