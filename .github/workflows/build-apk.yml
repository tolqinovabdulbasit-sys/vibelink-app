name: 🚀 Build VibeLink APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 📱 Flutter APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4

      - name: ☕ Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Flutter 3.22.3 o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: 📦 Dependencylarni yuklash
        run: flutter pub get

      - name: 🔍 Kod tekshiruvi
        run: flutter analyze --no-fatal-infos || true

      - name: 🔨 Debug APK yaratish
        run: |
          flutter build apk --debug \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}"

      - name: 📋 APK ni saqlash
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk \
             "artifacts/VibeLink-v1.0.${{ github.run_number }}.apk"
          echo "✅ APK tayyor:"
          ls -lh artifacts/

      - name: 📤 APK ni Artifacts ga yuklash
        uses: actions/upload-artifact@v4
        with:
          name: "VibeLink-APK-build-${{ github.run_number }}"
          path: "artifacts/VibeLink-v1.0.${{ github.run_number }}.apk"
          retention-days: 90

      - name: 📊 Build xulosasi
        run: |
          echo "## ✅ VibeLink APK muvaffaqiyatli qurildi!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Fayl | VibeLink-v1.0.${{ github.run_number }}.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔢 Build | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Sana | $(date '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Yuklab olish:" >> $GITHUB_STEP_SUMMARY
          echo "**Actions** → **Bu run** → **Artifacts** → **VibeLink-APK-build-${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
